<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">승인 상태 머신</title><desc id="desc">실행 중, 승인 대기, 실행 완료, 거부 종료 상태와 그 사이의 검증 조건을 보여 준다.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#233143"/></marker><style>.t{font:700 34px Arial;fill:#172333}.h{font:700 24px Arial;fill:#172333}.b{font:400 17px Arial;fill:#344256}.small{font:600 15px Arial;fill:#172333}.state{stroke:#233143;stroke-width:3}.ar{stroke:#233143;stroke-width:3;fill:none;marker-end:url(#a)}.bad{stroke:#9d3f37;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="650" fill="#f7f5ef"/><text x="55" y="65" class="t">승인은 boolean이 아니라 검증 가능한 상태 전이입니다</text>
  <circle class="state" cx="225" cy="280" r="105" fill="#d8eaf2"/><text x="175" y="273" class="h">실행 중</text><text x="160" y="305" class="b">RUNNING</text>
  <circle class="state" cx="600" cy="280" r="105" fill="#e8dfc8"/><text x="540" y="273" class="h">승인 대기</text><text x="525" y="305" class="b">WAITING</text>
  <circle class="state" cx="975" cy="280" r="105" fill="#dce8da"/><text x="915" y="273" class="h">실행 완료</text><text x="920" y="305" class="b">EXECUTED</text>
  <path class="ar" d="M330 250 C390 190 435 190 495 250"/><text x="370" y="172" class="small">부작용 도구 제안</text>
  <path class="ar" d="M705 250 C765 190 810 190 870 250"/><text x="748" y="172" class="small">승인 token 일치</text>
  <path class="ar" d="M520 355 C430 440 355 430 290 365"/><text x="355" y="465" class="small">거부 또는 수정 후 재제안</text>
  <rect class="state" x="445" y="510" width="310" height="85" rx="16" fill="#f2d7d5"/><text x="528" y="547" class="h">안전 종료</text><text x="482" y="574" class="b">BLOCKED + 오류 코드</text>
  <path class="bad" d="M600 386 V505"/>
  <text x="735" y="420" class="b">불일치·만료·중복</text><text x="735" y="450" class="b">→ executor 호출 없음</text>
  <rect x="55" y="90" width="1080" height="48" rx="10" fill="#fff" stroke="#176b87" stroke-width="2"/><text x="94" y="121" class="b">token = run_id + call_id + tool + approved_by + expires_at</text>
</svg>
